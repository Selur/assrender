name: Build wheels

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows x64, os: windows-latest, archs: AMD64 }
          - { name: Linux x86_64, os: ubuntu-latest, archs: x86_64 }
          - { name: macOS arm64, os: macos-14, archs: arm64 }
    steps:
      - uses: actions/checkout@v7

      - name: Diagnose the wheel build (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: bash
        run: |
          python -m pip install build
          set +e
          python -m build --wheel --outdir diag -Csetup-args=--vsenv -Csetup-args=-Db_vscrt=mt             -Csetup-args=--force-fallback-for=libass,freetype2,fribidi,harfbuzz,libpng,zlib > diag.log 2>&1
          status=$?
          if [ $status -ne 0 ]; then grep -v '^\s*$' diag.log | tail -25 | sed 's/^/::error::/'; fi
          exit $status

      - name: Build wheel
        uses: pypa/cibuildwheel@v4.3
        env:
          # The plugin only uses the VapourSynth C API, so one interpreter is enough;
          # the wheel is re-tagged to py3-none below.
          CIBW_BUILD: cp312-*
          CIBW_SKIP: '*-musllinux*'
          CIBW_ARCHS: ${{ matrix.archs }}
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          MACOSX_DEPLOYMENT_TARGET: '11.0'
          # Linux: FreeType, FriBidi, HarfBuzz and fontconfig from the system (auditwheel bundles them), libass from the subproject;
          # the fonts are only there for the test.
          CIBW_BEFORE_ALL_LINUX: dnf install -y freetype-devel fribidi-devel harfbuzz-devel fontconfig-devel dejavu-sans-fonts liberation-sans-fonts
          CIBW_CONFIG_SETTINGS_LINUX: setup-args=--force-fallback-for=libass
          # Windows and macOS: libass and all its dependencies statically from the subprojects.
          CIBW_CONFIG_SETTINGS_MACOS: setup-args=--force-fallback-for=libass,freetype2,fribidi,harfbuzz,libpng,zlib
          CIBW_REPAIR_WHEEL_COMMAND_MACOS: ''
          # MSVC instead of the MinGW g++ on the runner, runtime linked statically, so delvewheel would have nothing to bundle.
          CIBW_CONFIG_SETTINGS_WINDOWS: setup-args=--vsenv setup-args=-Db_vscrt=mt setup-args=--force-fallback-for=libass,freetype2,fribidi,harfbuzz,libpng,zlib
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: ''
          CIBW_TEST_COMMAND: python {project}/test/test_assrender.py

      - name: Re-tag wheel as Python-independent
        shell: bash
        run: |
          python -m pip install wheel
          python -m wheel tags --python-tag py3 --abi-tag none --remove wheelhouse/*.whl
          ls wheelhouse

      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.os }}
          path: wheelhouse/*.whl

  release:
    name: GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*.whl
          generate_release_notes: true
