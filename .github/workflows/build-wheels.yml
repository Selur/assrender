name: Build wheels

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows x64, os: windows-latest, archs: AMD64 }
          - { name: Linux x86_64, os: ubuntu-latest, archs: x86_64 }
          - { name: macOS arm64, os: macos-14, archs: arm64 }
    steps:
      - uses: actions/checkout@v7

      - name: Build wheel
        uses: pypa/cibuildwheel@v4.3
        env:
          # The plugin only uses the VapourSynth C API, so one interpreter is enough;
          # the wheel is re-tagged to py3-none below.
          CIBW_BUILD: cp312-*
          CIBW_SKIP: '*-musllinux*'
          CIBW_ARCHS: ${{ matrix.archs }}
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          MACOSX_DEPLOYMENT_TARGET: '11.0'
          # Linux: FreeType, FriBidi, HarfBuzz and fontconfig from the system (auditwheel bundles them), libass from the subproject;
          # the fonts are only there for the test.
          CIBW_BEFORE_ALL_LINUX: dnf install -y freetype-devel fribidi-devel harfbuzz-devel fontconfig-devel dejavu-sans-fonts liberation-sans-fonts
          CIBW_CONFIG_SETTINGS_LINUX: setup-args=--force-fallback-for=libass
          # Windows and macOS: libass and all its dependencies statically from the subprojects.
          # FreeType's optional brotli/bzip2 (WOFF2 and .pcf.bz2 fonts) are switched off: on the runner meson found Homebrew's
          # brotli, and with the repair step off the wheel linked /opt/homebrew/opt/brotli/lib/libbrotlidec.1.dylib.
          CIBW_CONFIG_SETTINGS_MACOS: setup-args=--force-fallback-for=libass,freetype2,fribidi,harfbuzz,libpng,zlib setup-args=-Dfreetype2:brotli=disabled setup-args=-Dfreetype2:bzip2=disabled
          CIBW_REPAIR_WHEEL_COMMAND_MACOS: ''
          # MSVC instead of the MinGW g++ on the runner, runtime linked statically, so delvewheel would have nothing to bundle.
          CIBW_CONFIG_SETTINGS_WINDOWS: setup-args=--vsenv setup-args=-Db_vscrt=mt setup-args=--force-fallback-for=libass,freetype2,fribidi,harfbuzz,libpng,zlib
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: ''
          CIBW_TEST_COMMAND: python {project}/test/test_assrender.py

      - name: Check that the macOS plugin links only system libraries
        if: runner.os == 'macOS'
        run: |
          mkdir check && cd check && unzip -q ../wheelhouse/*.whl
          otool -L vapoursynth/plugins/libassrender.dylib
          if otool -L vapoursynth/plugins/libassrender.dylib | tail -n +2 | grep -v -E '^\s+(/usr/lib/|/System/Library/)'; then
            echo "::error::libassrender.dylib links libraries outside /usr/lib and /System/Library"
            exit 1
          fi

      - name: Re-tag wheel as Python-independent
        shell: bash
        run: |
          python -m pip install wheel
          python -m wheel tags --python-tag py3 --abi-tag none --remove wheelhouse/*.whl
          ls wheelhouse

      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.os }}
          path: wheelhouse/*.whl

  release:
    name: GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*.whl
          generate_release_notes: true
