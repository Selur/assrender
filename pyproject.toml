[build-system]
build-backend = 'mesonpy'
requires = ['meson-python>=0.15']

[project]
name = 'vapoursynth-assrender'
dynamic = ['version']
description = 'AssRender (libass) subtitle renderer for VapourSynth (API 4)'
readme = 'README.md'
requires-python = '>=3.8'
dependencies = ['VapourSynth']

[tool.meson-python.args]
setup = ['-Dpython_package=true']

[tool.meson-python.wheel]
exclude = ['*/*.dll.a', '*/*.lib', '*/*.a']
